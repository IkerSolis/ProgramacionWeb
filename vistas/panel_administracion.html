<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusKey</title>
    <link rel="stylesheet" href="../styles.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/vue@3"></script>
</head>
<body> 
    <div id="app">
        <navbar-comp tipo="admin"></navbar-comp>
        <section class="home-top">
            <div class="container">
                <div class="row align-items-center g-5">
                    <div class="col-lg-6">
                        <p class="text-uppercase mb-2" style="font-size:.75rem;letter-spacing:.15em;color:var(--green-accent);font-weight:600;">
                        </p>
                        <h1 class="home-top-title mb-3">
                            Panel<br><span class="accent">de administración</span>
                        </h1>
                        <p class="home-top-subtitle mb-4">
                            Administra los productos del catálogo: crea nuevos registros, edita información existente o elimina productos.
                        </p>
                        <div class="admin-actions d-flex gap-3 mt-4">
                            <div class="admin-actions d-flex flex-wrap gap-3 mt-4">
                                <a href="add_product.html" class="btn nk-btn nk-add">
                                    <i class="bi bi-plus-circle me-2"></i>Añadir producto
                                </a>
                                <button class="btn nk-btn nk-edit">
                                    <i class="bi bi-pencil-square me-2"></i>Editar producto
                                </button>

                                <button class="btn nk-btn nk-delete">
                                    <i class="bi bi-trash me-2"></i>Eliminar producto
                                </button>
                            </div>
                        </div>
                    </div>    
                </div>
            </div>
        </section>
        <footer-comp tipo="principal"></footer-comp>
    </div>

    <script type="module" src="../js/app.js"></script>

</body>
</html>
