<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusKey</title>
    <link rel="stylesheet" href="../styles.css"/>

    <!-- CSS de otro REPOSITORIO -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Os-corona/prograWeb-CSS-Auxiliar@main/styles-log-in.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/vue@3"></script>

    <style>
    :root {
      --purple-dark:  #1a0a2e;
      --purple-mid:   #2d1057;
      --purple-light: #6b3fa0;
      --purple-soft:  #9d71c8;
      --green-accent: #7fff6e;
      --green-dim:    #4db847;
      --white-off:    #ede8f7;
      --card-bg:      #241042;
    }

    body {
      background-color: var(--purple-dark);
      background-image:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(107,63,160,.25) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(45,16,87,.4) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Syne', sans-serif;
      color: var(--white-off);
    }

    </style>
</head>
<body>
    <div id="app">
      <navbar-comp tipo="principal"></navbar-comp>
      <div class="login-wrapper">
        <div class="login-card">

          <div class="text-center mb-1">
            <a href="index.html" class="login-brand">Nexus<span>Key</span></a>
          </div>
          <p class="login-subtitle text-center">Bienvenido de vuelta, jugador</p>

          <p class="login-title text-center">Iniciar Sesión</p>

          <form novalidate>

            <div class="mb-3">
              <label class="login-label" for="email">Correo electrónico</label>
              <input
                id="email"
                type="email"
                class="login-input"
                placeholder="tu@correo.com"
                autocomplete="email"
              />
            </div>

            <div class="mb-3">
              <label class="login-label" for="password">Contraseña</label>
              <div class="login-input-group">
                <input
                  id="password"
                  type="password"
                  class="login-input"
                  placeholder="••••••••"
                  autocomplete="current-password"
                />
                <button type="button" class="login-input-icon" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <label class="login-check">
                <input type="checkbox"/> Recuérdame
              </label>
              <a href="#" class="login-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">
              <i class="bi bi-controller me-2"></i>Entrar
            </button>

          </form>

          <div class="login-divider">o continúa con</div>

          <div class="d-flex flex-column gap-2">
            <a href="#" class="btn-social">
              <i class="bi bi-google"></i> Google
            </a>
          </div>

          <p class="login-footer-text">
            ¿Aún no tienes cuenta? <a href="register.html">Regístrate gratis</a>
          </p>

        </div>
      </div>
      <footer-comp tipo="principal"></footer-comp>
    </div>
    
    <script type="module" src="../js/app.js"></script>

</body>
