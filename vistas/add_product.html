<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusKey</title>
    <link rel="stylesheet" href="../styles.css"/>

    <!-- CSS de otro REPOSITORIO -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Os-corona/prograWeb-CSS-Auxiliar@main/styles-log-in.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/vue@3"></script>

    <style>
    :root {
      --purple-dark:  #1a0a2e;
      --purple-mid:   #2d1057;
      --purple-light: #6b3fa0;
      --purple-soft:  #9d71c8;
      --green-accent: #7fff6e;
      --green-dim:    #4db847;
      --white-off:    #ede8f7;
      --card-bg:      #241042;
    }

    body {
      background-color: var(--purple-dark);
      background-image:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(107,63,160,.25) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(45,16,87,.4) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Syne', sans-serif;
      color: var(--white-off);
    }
    </style>

</head>
<body>
  <div id="app">
      <navbar-comp tipo="admin"></navbar-comp>
      <div class="login-wrapper">
      <div class="login-card" style="max-width: 480px;">

        <div class="text-center mb-1">
          <a href="index.html" class="login-brand">Nexus<span>Key</span></a>
        </div>

        <p class="login-title text-center">Agrega el Producto</p>

        <form novalidate>

          <div class="mb-3">
            <label class="login-label" for="product_name">Nombre del producto</label>
            <div class="login-input-group">
              <input
                id="product_name"
                type="text"
                class="login-input"
                placeholder="Videojuego X"
              />
              <span class="login-input-icon" style="cursor:default;">
                <i class="bi bi-controller"></i>
              </span>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-12">
              <label class="login-label" for="descripcion">Descripcion del juego</label>
              <input
                id="descripcion"
                type="text"
                class="login-input"
                placeholder="Describe el juego en detalle"
                autocomplete="given-name"
                style="padding-bottom: 40px;"
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="login-label" for="price">Precio</label>
            <div class="login-input-group">
              <input
                id="price"
                type="number"
                step="0.01"
                min="1.00"
                class="login-input"
                placeholder="$9.99"
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="login-label" for="plataform">Plataforma</label>
            <div class="login-input-group">
              <input
                id="plataform"
                type="text"
                class="login-input"
                placeholder="XBOX/PS5/PC"
              />
            </div> </div>

          <div class="d-flex flex-column gap-2 mb-4 pt-4">
            <label class="login-check">
              <input type="checkbox"/>
              Activar producto
            </label>
          </div>

          <button type="submit" class="btn-login">
            <i class="bi bi-xbox"></i> Agregar Producto
          </button>

        </form>
        <p class="login-footer-text">
          Asegurate de que la informacion este correcta
        </p>
      </div>
    </div>
    <footer-comp tipo="principal"></footer-comp>
  </div>
    
  <script type="module" src="../js/app.js"></script>

</body>
</html>
