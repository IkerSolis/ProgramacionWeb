<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>

    <link rel="stylesheet" href="../styles.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/vue@3"></script>

    <style>
    :root {
      --purple-dark:  #1a0a2e;
      --purple-mid:   #2d1057;
      --purple-light: #6b3fa0;
      --purple-soft:  #9d71c8;
      --green-accent: #7fff6e;
      --green-dim:    #4db847;
      --white-off:    #ede8f7;
      --card-bg:      #241042;
    }

    body {
      background-color: var(--purple-dark);
      background-image:
        radial-gradient(ellipse 70% 60% at 20% 20%, rgba(107,63,160,.25) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(45,16,87,.4) 0%, transparent 60%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Syne', sans-serif;
      color: var(--white-off);
    }

    </style>
</head>
<body>
    <div id="app">
        <navbar-comp tipo="admin"></navbar-comp>
         <section class="catalog-header">
            <div class="container">
            <div class="d-flex flex-wrap align-items-end justify-content-between gap-3">
                <div>
                <h1 class="catalog-header-title mb-1">
                    Catálogo de <span>Videojuegos</span>
                </h1>
                <p style="color:var(--purple-soft);font-size:.92rem;margin:0;">
                    Explora nuestra colección completa. Filtra, busca y encuentra tu próximo juego favorito.
                </p>
                </div>
            </div>
            </div>
        </section>

        <section class="catalog-products py-5">
            <h2 class="visually-hidden">Listado de productos</h2>
            <div class="container">
                <div class="row g-4">
                    <div class="col-6 col-md-4 col-lg-3">
                        <div class="product-card">
                            <img src="../img/horaPico-Rumbel.png" alt="Producto 1">
                                <p class="product-name">Hora Pico: Rumble Arena</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer-comp tipo="principal"></footer-comp>
    </div>

    <script type="module" src="../js/app.js"></script>

</body>
</html>
