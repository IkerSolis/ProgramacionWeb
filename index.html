<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusKey</title>
    <link rel="stylesheet" href="styles.css"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Syne:wght@400;600&display=swap" rel="stylesheet"/>

    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
  <div id="app">
    <navbar-comp tipo="principal"></navbar-comp>

    <section class="home-top">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <p class="text-uppercase mb-2" style="font-size:.75rem;letter-spacing:.15em;color:var(--green-accent);font-weight:600;">
                        <i class="bi bi-controller me-1"></i> Tu tienda de keys definitiva
                    </p>
                    <h1 class="home-top-title mb-3">
                        Expande tu catálogo<br><span class="accent">de videojuegos</span>
                    </h1>
                    <p class="home-top-subtitle mb-4">
                        Miles de títulos para todas las plataformas. Desde indie hasta AAA, encuentra el juego perfecto para ti.
                    </p>
                </div>    
            

                <div class="col-lg-6 d-flex justify-content-center">
                    <div>
                        <img src="img/collage.webp" alt="Collage" width="600" style="padding: 5px; border-radius: 17px;">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="search-section">
    <div>
        <h1 class="text-uppercase mb-2" style="font-size:.75rem;letter-spacing:.15em;color:var(--green-accent);font-weight:600;padding-left: 50px;">
            <i class="bi bi-controller me-1"></i> Busca tu juego en nuestro catalogo
        </h1>
    </div>
    <div class="container">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-6">
          <div class="input-group">
            <input type="text" class="form-control search-input" placeholder="Buscar juego..."/>
                <a href="vistas/catalogo.html" class="search-btn">
                    <i class="bi bi-search"></i>
                </a>    
          </div>
        </div>
        <div class="col-6 col-md-2">
          <select class="filter-select">
            <option value="">Plataforma</option>
            <option>PC</option>
            <option>PlayStation</option>
            <option>Xbox</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="filter-select">
            <option value="">Género</option>
            <option>Acción</option>
            <option>RPG</option>
            <option>Estrategia</option>
            <option>Deportes</option>
          </select>
        </div>
        <div class="col-6 col-md-2">  
          <select class="filter-select">
            <option value="">Precio</option>
            <option>Menos de $200</option>
            <option>$200 - $600</option>
            <option>Más de $600</option>
          </select>
        </div>
      </div>
    </div>
  </section>
  <footer-comp tipo="index"></footer-comp>
  </div>
    
  <script type="module" src="js/app.js"></script>

</body>
</html>
